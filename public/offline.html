<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline | Ar-Learn</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #f8f9fc; color: #333; }
        .card { background: white; padding: 2rem; border-radius: 1rem; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; max-width: 400px; }
        h1 { color: #1e3a8a; margin-top: 0; }
        p { color: #666; line-height: 1.5; }
        button { background: #1e3a8a; color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 0.5rem; font-weight: bold; cursor: pointer; margin-top: 1rem; }
    </style>
</head>
<body>
    <div class="card">
        <h1>You're Offline</h1>
        <p>It looks like you've lost your internet connection. Don't worry, you can still mark attendance and enter results—they'll be synced automatically when you're back online.</p>
        <button onclick="window.location.reload()">Retry Connection</button>
    </div>
</body>
</html>
